name: Publish scheduled post

on:
  schedule:
    - cron: '0 14 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish queued post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          CONTENT=$(tr -d '[:space:]' < next_post.txt)
          if [ -z "$CONTENT" ]; then
            echo "Очередь пуста, публиковать нечего"
            exit 0
          fi
          TEXT=$(cat next_post.txt)
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHANNEL_ID}" \
            --data-urlencode text="${TEXT}"
          echo -n "" > next_post.txt

      - name: Commit cleared queue
        run: |
          git config user.name "publish-bot"
          git config user.email "actions@github.com"
          git add next_post.txt
          git diff --cached --quiet || git commit -m "Опубликовано, очередь очищена"
          git push
