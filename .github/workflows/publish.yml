name: Publish scheduled post

on:
  schedule:
    # Основной график: вторник и пятница, 19:00 Екатеринбурга (14:00 UTC).
    - cron: '0 14 * * 2,5'
    # Контроль пропущенной публикации в тот же вечер (21:00 и 23:00 Екатеринбурга).
    # GitHub может задержать или пропустить запуск по расписанию. Контрольный запуск
    # публикует только если в текущем слоте ещё ничего не вышло (см. проверку ниже),
    # поэтому дубля не будет.
    - cron: '0 16 * * 2,5'
    - cron: '0 18 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

# Запуски не выполняются параллельно: второй ждёт окончания первого
# и затем видит уже обновлённую очередь.
concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Актуальная голова main на момент запуска (а не SHA события), полная история для проверки слота.
          ref: main
          fetch-depth: 0

      - name: Publish next post in queue
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          set -euo pipefail

          # Слот публикации — последний вторник/пятница 14:00 UTC, не позже текущего момента.
          NOW=$(date -u +%s)
          SLOT=""
          for d in 0 1 2 3 4 5 6 7; do
            CAND=$(date -u -d "$(date -u +%F) -${d} day 14:00" +%s)
            DOW=$(date -u -d "@${CAND}" +%u)
            if [ "$CAND" -le "$NOW" ] && { [ "$DOW" = 2 ] || [ "$DOW" = 5 ]; }; then SLOT=$CAND; break; fi
          done
          LAST_PUB=$(git log -1 --format=%ct --grep='^Опубликовано: ' || true)
          echo "Слот: $(date -u -d "@${SLOT}")  Последняя публикация: $( [ -n "$LAST_PUB" ] && date -u -d "@${LAST_PUB}" || echo нет)"
          if [ -n "$LAST_PUB" ] && [ "$LAST_PUB" -ge "$SLOT" ]; then
            echo "В текущем слоте пост уже опубликован — повторно не публикуем"
            exit 0
          fi

          NEXT_FILE=$(ls queue/*.txt 2>/dev/null | sort -V | head -n 1 || true)
          if [ -z "$NEXT_FILE" ]; then
            echo "Очередь пуста, публиковать нечего"
            exit 0
          fi
          BASENAME=$(basename "$NEXT_FILE" .txt)
          MEDIA_DIR="queue/media/$BASENAME"
          TEXT=$(cat "$NEXT_FILE")
          TEXT_LEN=$(printf '%s' "$TEXT" | wc -m)

          git config user.name "publish-bot"
          git config user.email "actions@github.com"

          if [ -d "$MEDIA_DIR" ]; then
            mapfile -t PHOTOS < <(ls "$MEDIA_DIR" | sort -V)

            # --form-string: значение передаётся как есть. С -F значение, начинающееся с «@»
            # (например, @имя_канала), curl считает путём к файлу и падает с кодом 26.
            CURL_ARGS=(--form-string "chat_id=${CHANNEL_ID}")
            MEDIA_JSON="[]"
            for i in "${!PHOTOS[@]}"; do
              FIELD="photo$i"
              CURL_ARGS+=(-F "${FIELD}=@${MEDIA_DIR}/${PHOTOS[$i]}")
              if [ "$i" -eq 0 ] && [ "$TEXT_LEN" -le 1024 ]; then
                MEDIA_JSON=$(echo "$MEDIA_JSON" | jq --arg media "attach://${FIELD}" --arg caption "$TEXT" '. + [{"type":"photo","media":$media,"caption":$caption}]')
              else
                MEDIA_JSON=$(echo "$MEDIA_JSON" | jq --arg media "attach://${FIELD}" '. + [{"type":"photo","media":$media}]')
              fi
            done

            curl -sS -f -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" \
              "${CURL_ARGS[@]}" --form-string "media=${MEDIA_JSON}" > /dev/null
            echo "Альбом отправлен: ${#PHOTOS[@]} фото"

            # Сразу фиксируем отправку альбома: если дальше не уйдёт текст,
            # повторный запуск отправит только текст, без второго альбома.
            git rm -r -q "$MEDIA_DIR"
            if [ "$TEXT_LEN" -gt 1024 ]; then
              git commit -q -m "Альбом отправлен: $(basename "$NEXT_FILE")"
              git push -q
            fi
          fi

          # Текст отдельным сообщением: если он длиннее подписи к альбому (1024 символа)
          # или альбома в этом запуске не было (пост без фото либо альбом уже ушёл ранее).
          if [ "$TEXT_LEN" -gt 1024 ] || [ -z "${PHOTOS+x}" ]; then
            curl -sS -f -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHANNEL_ID}" \
              --data-urlencode "text=${TEXT}" > /dev/null
            echo "Текст отправлен: ${TEXT_LEN} символов"
          fi

          git rm -q "$NEXT_FILE"
          git commit -q -m "Опубликовано: $(basename "$NEXT_FILE")"
          git push -q
