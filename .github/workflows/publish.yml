name: Publish scheduled post

on:
  schedule:
    - cron: '0 14 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish next post in queue
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          NEXT_FILE=$(ls queue/*.txt 2>/dev/null | sort -V | head -n 1)
          if [ -z "$NEXT_FILE" ]; then
            echo "Очередь пуста, публиковать нечего"
            exit 0
          fi
          TEXT=$(cat "$NEXT_FILE")
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHANNEL_ID}" \
            --data-urlencode text="${TEXT}"
          git config user.name "publish-bot"
          git config user.email "actions@github.com"
          git rm "$NEXT_FILE"
          git commit -m "Опубликовано: $(basename "$NEXT_FILE")"
          git push
